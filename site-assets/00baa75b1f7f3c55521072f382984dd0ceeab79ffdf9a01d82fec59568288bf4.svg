<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Associate product manager interview practice loop</title>
  <desc id="desc">Clarify the problem, structure your answer, practice out loud, then review feedback and repeat.</desc>
  <rect width="960" height="260" rx="24" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="480" y="46" font-size="24" font-weight="700" fill="#14263d">Build your APM interview answer, one attempt at a time</text>
    <g fill="#fff" stroke="#315c99" stroke-width="2">
      <rect x="24" y="84" width="198" height="114" rx="16"/>
      <rect x="262" y="84" width="198" height="114" rx="16"/>
      <rect x="500" y="84" width="198" height="114" rx="16"/>
      <rect x="738" y="84" width="198" height="114" rx="16"/>
    </g>
    <g font-size="19" font-weight="700" fill="#14263d">
      <text x="123" y="122">Clarify</text><text x="361" y="122">Structure</text>
      <text x="599" y="122">Practice</text><text x="837" y="122">Review</text>
    </g>
    <g font-size="15" fill="#36485e">
      <text x="123" y="152">Goal, users and</text><text x="123" y="174">assumptions</text>
      <text x="361" y="152">Options, decisions</text><text x="361" y="174">and trade-offs</text>
      <text x="599" y="152">Answer aloud and</text><text x="599" y="174">handle follow-ups</text>
      <text x="837" y="152">Pick one improvement</text><text x="837" y="174">for the next attempt</text>
    </g>
    <g font-size="26" fill="#315c99"><text x="242" y="150">→</text><text x="480" y="150">→</text><text x="718" y="150">→</text></g>
    <text x="480" y="234" font-size="16" fill="#36485e">Repeat with a different question to test whether your reasoning transfers.</text>
  </g>
</svg>
