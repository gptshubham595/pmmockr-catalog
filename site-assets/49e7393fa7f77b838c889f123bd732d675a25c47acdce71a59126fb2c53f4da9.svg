<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="achievement-share-title achievement-share-desc">
  <title id="achievement-share-title">50 Interviews PM Card LinkedIn share image</title>
  <desc id="achievement-share-desc">A public LinkedIn share image for the 50 Interviews PM Card achievement on PMMockr.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080a10"/>
      <stop offset="0.56" stop-color="#10131c"/>
      <stop offset="1" stop-color="#17110a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11151f"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#bf8f2e"/>
      <stop offset="0.42" stop-color="#ffe580"/>
      <stop offset="0.72" stop-color="#e0b94e"/>
      <stop offset="1" stop-color="#8e6a24"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#252529"/>
      <stop offset="0.5" stop-color="#101114"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#ffe580" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#d1a33b" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.035"/>
      <circle cx="18" cy="18" r="1.7" fill="#ffe580" opacity="0.08"/>
    </pattern>
    <filter id="panelShadow" x="-8%" y="-14%" width="116%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="cardShadow" x="-18%" y="-16%" width="136%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.92  0 1 0 0 0.68  0 0 1 0 0.22  0 0 0 0.55 0"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)" opacity="0.7"/>
  <path d="M38 405 L714 30 H1166 V598 H38 Z" fill="#10131c" opacity="0.54"/>
  <rect x="34" y="30" width="1132" height="570" rx="36" fill="url(#panel)" stroke="#6c5520" stroke-width="2" filter="url(#panelShadow)"/>
  <rect x="58" y="54" width="1084" height="522" rx="26" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07"/>

  <g transform="translate(76 70)">
    <text x="0" y="0" fill="url(#gold)" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="950">PMMockr</text>
    <text x="0" y="46" fill="#a7acb8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">PM Card achievement unlocked</text>

    <text x="0" y="126" fill="#fff8e2" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="950">I collected the</text>
    <text x="0" y="190" fill="#fff8e2" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="950">50 Interviews</text>

    <g transform="translate(0 226)">
      <rect width="432" height="58" rx="29" fill="#17120a" stroke="url(#gold)" stroke-width="2"/>
      <text x="216" y="37" fill="#ffe580" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="950" text-anchor="middle">Achievement Unlocked</text>
    </g>

    <text x="0" y="342" fill="#cfd2d9" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Complete 50 PM mock interviews.</text>
    <text x="0" y="378" fill="#cfd2d9" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">PM interview practice, proven.</text>

    <g transform="translate(0 414)">
      <rect width="238" height="54" rx="27" fill="url(#gold)"/>
      <rect x="2" y="2" width="234" height="50" rx="25" fill="#17120a" opacity="0.22"/>
      <text x="119" y="35" fill="#080a10" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="950" text-anchor="middle">pmmockr.com</text>
      <text x="272" y="35" fill="#fff8e2" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="950">Built by PMs for PMs</text>
    </g>
  </g>

  <g transform="translate(650 74)" filter="url(#cardShadow)">

    <g transform="translate(120 18)">
      <rect x="0" y="0" width="314" height="444" rx="30" fill="#06070b"/>
      <rect x="18" y="18" width="278" height="408" rx="23" fill="url(#cardFace)" stroke="url(#gold)" stroke-width="3"/>
      <rect x="34" y="34" width="246" height="376" rx="18" fill="url(#cardGlow)" stroke="#8e6a24" stroke-width="1.4" opacity="0.9"/>
      <rect x="48" y="48" width="218" height="348" rx="14" fill="none" stroke="#ffe580" stroke-width="1" opacity="0.24"/>
      <rect x="48" y="48" width="218" height="348" rx="14" fill="url(#dotGrid)" opacity="0.68"/>

      <text x="76" y="112" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" text-anchor="middle" filter="url(#softGlow)">Q</text>
      <text x="76" y="144" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" text-anchor="middle">♠</text>
      <text x="238" y="358" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" text-anchor="middle" filter="url(#softGlow)">Q</text>
      <text x="238" y="390" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" text-anchor="middle">♠</text>

      <path d="M64 212 C98 144 216 144 250 212" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.34"/>
      <path d="M64 286 C98 354 216 354 250 286" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.34"/>
      <text x="157" y="246" fill="none" stroke="url(#gold)" stroke-width="2.5" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" letter-spacing="-4">PM</text>
      <text x="157" y="338" fill="none" stroke="url(#gold)" stroke-width="2.5" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" letter-spacing="-4" transform="rotate(180 157 292)">PM</text>
      <rect x="82" y="362" width="150" height="2" rx="1" fill="url(#gold)" opacity="0.5"/>
    </g>
  </g>
</svg>
