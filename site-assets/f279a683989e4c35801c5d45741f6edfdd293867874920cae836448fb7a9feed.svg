<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="contest-past-selector-title contest-past-selector-desc">
  <title id="contest-past-selector-title">Royal past contest selector</title>
  <desc id="contest-past-selector-desc">A royal archive carousel with stone contest tablets, a winner crest, and a glowing selected past contest marker.</desc>
  <defs>
    <linearGradient id="past-bg" x1="12" y1="14" x2="306" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#232d46"/>
      <stop offset=".5" stop-color="#111318"/>
      <stop offset="1" stop-color="#24190f"/>
    </linearGradient>
    <linearGradient id="past-tablet" x1="49" y1="67" x2="272" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#444d5a"/>
      <stop offset=".5" stop-color="#252b35"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="past-selected" x1="65" y1="87" x2="257" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a3016"/>
      <stop offset=".5" stop-color="#182033"/>
      <stop offset="1" stop-color="#103b33"/>
    </linearGradient>
    <linearGradient id="past-gold" x1="105" y1="30" x2="225" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7bc"/>
      <stop offset=".42" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#b66b19"/>
    </linearGradient>
    <linearGradient id="past-cyan" x1="88" y1="105" x2="248" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#baf7ff"/>
      <stop offset=".52" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#3b5cff"/>
    </linearGradient>
    <linearGradient id="past-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#caffde"/>
      <stop offset=".6" stop-color="#43dc95"/>
      <stop offset="1" stop-color="#15926a"/>
    </linearGradient>
    <filter id="past-shadow" x="-20%" y="-24%" width="140%" height="154%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#03050a" flood-opacity=".42"/>
    </filter>
    <filter id="past-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffc861" flood-opacity=".46"/>
    </filter>
  </defs>
  <g opacity=".68">
    <ellipse cx="160" cy="184" rx="116" ry="20" fill="#2563eb" opacity=".16"/>
    <ellipse cx="160" cy="184" rx="78" ry="11" fill="#ddb7ff" opacity=".18"/>
    <path d="M38 46h22M49 35v22M261 48h20M271 38v20" stroke="#b4c5ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 166l5 9 10 2-7 7 1 10-9-5-9 5 1-10-7-7 10-2 5-9ZM276 164l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2 5-10Z" fill="#ffc861" opacity=".64"/>
  </g>

  <g filter="url(#past-shadow)">
    <path d="M62 92h74l12 12v58l-12 12H62l-12-12v-58l12-12Z" fill="#0f172a" fill-opacity=".78" stroke="#5b9dff" stroke-opacity=".5" stroke-width="2"/>
    <path d="M74 111h42M74 126h30M74 142h50" stroke="#bfc9dc" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
    <path d="M92 75l10 14h-20l10-14Z" fill="url(#past-cyan)" opacity=".72"/>

    <path d="M118 62h84l22 22v86l-22 22h-84l-22-22V84l22-22Z" fill="url(#past-tablet)" stroke="#73829b" stroke-opacity=".68" stroke-width="2"/>
