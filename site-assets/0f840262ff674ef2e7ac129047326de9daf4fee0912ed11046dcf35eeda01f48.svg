<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="ai-blue-ball-title ai-blue-ball-desc">
  <title id="ai-blue-ball-title">AI Blue Ball Interview Animation</title>
  <desc id="ai-blue-ball-desc">MockPM blue AI interviewer presence for mock interview speaking and thinking states.</desc>
  <defs>
    <radialGradient id="pmready-ai-orb-core" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#d8e2ff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#adc6ff" stop-opacity="0.72"/>
      <stop offset="67%" stop-color="#4d8eff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0d0d0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pmready-ai-orb-halo" cx="50%" cy="50%" r="66%">
      <stop offset="0%" stop-color="#adc6ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#005ac2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0d0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="pmready-ai-orb-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="320" height="320" fill="#000000"/>
  <g transform-origin="160 160">
    <animateTransform attributeName="transform" type="scale" values="0.96;1.04;0.96" dur="4.8s" repeatCount="indefinite"/>
    <circle cx="160" cy="160" r="118" fill="url(#pmready-ai-orb-halo)" filter="url(#pmready-ai-orb-blur)">
      <animate attributeName="opacity" values="0.42;0.82;0.42" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="160" r="82" fill="url(#pmready-ai-orb-core)" filter="url(#pmready-ai-orb-blur)">
      <animate attributeName="opacity" values="0.62;0.94;0.62" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="142" r="28" fill="#f4f4f5" opacity="0.16" filter="url(#pmready-ai-orb-blur)">
      <animate attributeName="opacity" values="0.10;0.26;0.10" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
