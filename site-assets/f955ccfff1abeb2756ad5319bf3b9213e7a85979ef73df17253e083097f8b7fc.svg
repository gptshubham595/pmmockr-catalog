<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="contest-current-card-title contest-current-card-desc">
  <title id="contest-current-card-title">Royal current contest pass</title>
  <desc id="contest-current-card-desc">A royal game-style contest pass with a gem seal, countdown rails, and two active case gates.</desc>
  <defs>
    <linearGradient id="current-sky" x1="26" y1="18" x2="330" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20324d"/>
      <stop offset=".46" stop-color="#101318"/>
      <stop offset="1" stop-color="#17261f"/>
    </linearGradient>
    <linearGradient id="current-gold" x1="93" y1="25" x2="250" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7bc"/>
      <stop offset=".4" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#b96b18"/>
