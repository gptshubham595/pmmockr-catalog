<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="asset-title asset-desc">
  <title id="asset-title">PMMockr Interview Readiness Score</title>
  <desc id="asset-desc">A polished LinkedIn share card for PMMockr AI product manager interview readiness.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="0.56" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ecfff8"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4169e1"/>
      <stop offset="1" stop-color="#23b983"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="0.58" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="softPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shellShadow" x="-8%" y="-10%" width="116%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
    <filter id="panelShadow" x="-14%" y="-16%" width="128%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#0b1220" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#pageBg)"/>
  <circle cx="1020" cy="108" r="180" fill="#4edea3" opacity="0.12"/>
  <circle cx="160" cy="552" r="220" fill="#4169e1" opacity="0.09"/>
  <rect x="32" y="28" width="1136" height="574" rx="38" fill="url(#softPanel)" stroke="#d9e6f7" stroke-width="2" filter="url(#shellShadow)"/>

  <g transform="translate(82 66)">
    <text x="0" y="42" fill="#4169e1" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="950">PMMockr</text>
    <rect x="0" y="66" width="298" height="38" rx="19" fill="#ecf3ff" stroke="#cfddf3" stroke-width="1.4"/>
    <text x="22" y="91" fill="#52617a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">AI PM mock interview practice</text>

    <text x="0" y="176" fill="#101624" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="950">Interview</text>
    <text x="0" y="238" fill="#101624" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="950">readiness score,</text>
    <text x="0" y="300" fill="#101624" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="950">not guesswork.</text>

    <text x="0" y="356" fill="#44516a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Practice product design, strategy, analytics,</text>
    <text x="0" y="392" fill="#44516a" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">execution, and behavioral PM interviews.</text>

    <g transform="translate(0 428)">
      <rect width="232" height="54" rx="27" fill="url(#brandGrad)"/>
      <text x="116" y="35" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="950" text-anchor="middle">pmmockr.com</text>
      <text x="256" y="35" fill="#101624" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="950">Built by PMs for PMs</text>
    </g>
  </g>

  <g transform="translate(650 76)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="448" height="478" rx="34" fill="#0b1220"/>
    <rect x="20" y="20" width="408" height="438" rx="26" fill="url(#darkPanel)" stroke="#4edea3" stroke-width="2.4"/>

    <g transform="translate(46 48)">
      <rect width="204" height="42" rx="21" fill="#162339" stroke="#33425c" stroke-width="1.2"/>
      <circle cx="23" cy="21" r="8" fill="#4edea3"/>
      <text x="42" y="27" fill="#eaf1ff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">LinkedIn-ready report</text>
      <text x="356" y="28" fill="#adc6ff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="950" text-anchor="end">PMMockr</text>
    </g>

    <g transform="translate(52 124)">
      <circle cx="92" cy="92" r="86" fill="none" stroke="#263247" stroke-width="18"/>
      <circle cx="92" cy="92" r="86" fill="none" stroke="#4edea3" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="74 26" transform="rotate(-90 92 92)"/>
      <circle cx="92" cy="92" r="58" fill="#142a2b"/>
      <text x="92" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="950" text-anchor="middle">PM</text>
      <text x="92" y="121" fill="#4edea3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="950" text-anchor="middle">READY</text>
    </g>

    <g transform="translate(244 138)">
      <rect width="130" height="74" rx="18" fill="#121d30" stroke="#31415b" stroke-width="1.2"/>
      <text x="20" y="30" fill="#adc6ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900">Signal</text>
      <text x="20" y="55" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="950">AI</text>

      <rect y="92" width="130" height="74" rx="18" fill="#121d30" stroke="#31415b" stroke-width="1.2"/>
      <text x="20" y="122" fill="#adc6ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900">Next rep</text>
      <text x="20" y="147" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="950">Clarity</text>
    </g>

    <g transform="translate(52 332)">
      <text x="0" y="0" fill="#eaf1ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Product Sense</text>
      <text x="344" y="0" fill="#4edea3" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="950" text-anchor="end">86</text>
      <rect y="14" width="344" height="9" rx="4.5" fill="#293447"/>
      <rect y="14" width="296" height="9" rx="4.5" fill="#4edea3"/>

      <text x="0" y="52" fill="#eaf1ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Strategy</text>
      <text x="344" y="52" fill="#adc6ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="950" text-anchor="end">74</text>
      <rect y="66" width="344" height="9" rx="4.5" fill="#293447"/>
      <rect y="66" width="255" height="9" rx="4.5" fill="#adc6ff"/>

      <text x="0" y="104" fill="#eaf1ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Execution</text>
      <text x="344" y="104" fill="#ffcf7a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="950" text-anchor="end">80</text>
      <rect y="118" width="344" height="9" rx="4.5" fill="#293447"/>
      <rect y="118" width="275" height="9" rx="4.5" fill="#ffcf7a"/>
    </g>
  </g>
</svg>
