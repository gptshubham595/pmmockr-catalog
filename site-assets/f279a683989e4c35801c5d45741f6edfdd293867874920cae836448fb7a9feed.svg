    <path d="M118 170h84" stroke="#05070b" stroke-opacity=".45" stroke-width="5"/>

    <g filter="url(#past-glow)">
      <path d="M127 54l10-16 23 12 23-12 10 16-10 16h-46l-10-16Z" fill="url(#past-gold)" stroke="#fff7bc" stroke-opacity=".76" stroke-width="2" stroke-linejoin="round"/>
      <path d="M160 46l9 12h-18l9-12Z" fill="url(#past-cyan)"/>
      <circle cx="138" cy="56" r="4" fill="#a81f46"/>
      <circle cx="182" cy="56" r="4" fill="#43dc95"/>
    </g>

    <path d="M119 98h82l12 12-12 12h-82l-12-12 12-12Z" fill="url(#past-selected)" stroke="#ffc861" stroke-opacity=".82" stroke-width="2"/>
    <path d="M132 109h36M179 109h14M132 118h52" stroke="#f4efe7" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/>
    <path d="M192 104l9 6-9 6-9-6 9-6Z" fill="url(#past-emerald)" stroke="#caffde" stroke-opacity=".68"/>
    <path d="M124 138h72l10 10-10 10h-72l-10-10 10-10Z" fill="#141923" stroke="#5b9dff" stroke-opacity=".52" stroke-width="2"/>
    <path d="M136 147h30M136 154h43" stroke="#bfc9dc" stroke-opacity=".46" stroke-width="5" stroke-linecap="round"/>

    <path d="M184 94h74l12 12v56l-12 12h-74l-12-12v-56l12-12Z" fill="#101827" fill-opacity=".84" stroke="#b4c5ff" stroke-opacity=".46" stroke-width="2"/>
    <path d="M196 113h38M196 128h48M196 143h30" stroke="#bfc9dc" stroke-opacity=".48" stroke-width="5" stroke-linecap="round"/>
    <path d="M225 78l11 13h-22l11-13Z" fill="url(#past-cyan)" opacity=".74"/>
  </g>

  <g>
    <path d="M30 112l15-13v26l-15-13ZM290 112l-15-13v26l15-13Z" fill="#0f172a" fill-opacity=".9" stroke="#b4c5ff" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="49" cy="112" r="4" fill="#43dc95"/>
    <circle cx="271" cy="112" r="4" fill="#43dc95"/>
    <path d="M95 198h130" stroke="#73829b" stroke-opacity=".32" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
